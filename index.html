<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>小学数学 · 课堂互动描边测周长</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <div class="workspace">
      <aside class="left-rail">
        <div class="left-rail-spacer" aria-hidden="true"></div>
        <div class="left-rail-actions">
          <label class="btn btn-primary upload-label left-rail-btn">
            <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" hidden />
            上传图片
          </label>
          <button type="button" class="btn left-rail-btn" id="btnRedo" title="Ctrl+Y">重做</button>
          <button type="button" class="btn left-rail-btn" id="btnGrid">网格背景</button>
          <button type="button" class="btn left-rail-btn" id="btnCalibrate">标定</button>
          <button type="button" class="btn btn-primary left-rail-btn" id="btnExport">导出 PNG</button>
          <div class="left-rail-ops">
            <button
              type="button"
              class="btn left-rail-btn"
              id="btnToLine"
              disabled
              title="保留原曲线：复制蓝色虚线弦（端点连线）+ 绿色等弧长水平线，可与原曲线对比"
            >
              弦线对比
            </button>
            <button type="button" class="btn left-rail-btn" id="btnToCurve" disabled>转为曲线</button>
            <button
              type="button"
              class="btn left-rail-btn"
              id="btnUnfoldStraight"
              disabled
              title="把当前选中的封闭轮廓当作一条绳子，动画「拆开」拉成一条等长的直线（同一条线形变，不是另画一根）"
            >
              拉直演示
            </button>
            <button
              type="button"
              class="btn left-rail-btn"
              id="btnRestoreUnfold"
              disabled
              title="把「拉直演示」后的直线还原成拉直前的封闭曲线（需未删掉那条直线）"
            >
              还原曲线
            </button>
            <button type="button" class="btn left-rail-btn btn-warn" id="btnDeleteSel" disabled>删除选中</button>
          </div>
        </div>
      </aside>

      <div class="workspace-main">
        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="c"></canvas>
          <div class="pan-hint" id="panHint">按住空格拖动画布 · 滚轮缩放</div>
        </div>

        <div class="bottom-dock">
          <div class="dock-group dock-frequent">
            <button type="button" class="btn dock-frequent-btn" id="btnUndo" title="Ctrl+Z">撤销</button>
            <button type="button" class="btn dock-frequent-btn btn-warn" id="btnClear">清空笔迹</button>
          </div>

          <div class="dock-vdivider dock-vdivider--after-frequent" aria-hidden="true"></div>

          <div class="dock-group dock-tools">
            <button type="button" class="tool-btn active" data-tool="brush" title="手绘描边">
              <span class="tool-icon">✎</span>
              <span class="tool-label">画笔</span>
            </button>
            <button type="button" class="tool-btn" data-tool="line" title="点击连线，双击结束">
              <span class="tool-icon">╱</span>
              <span class="tool-label">直线</span>
            </button>
            <button type="button" class="tool-btn" data-tool="select" title="选择线条">
              <span class="tool-icon">➤</span>
              <span class="tool-label">选择</span>
            </button>
          </div>

          <div class="dock-vdivider" aria-hidden="true"></div>

          <div class="dock-group dock-brush">
            <label class="color-wrap dock-color">
              <span class="small-label">颜色</span>
              <input type="color" id="brushColor" value="#e53935" />
            </label>
            <label class="width-wrap dock-width">
              <span class="small-label">粗细</span>
              <input type="range" id="brushWidth" min="2" max="24" value="4" />
              <span id="brushWidthVal">4</span>px
            </label>
          </div>
        </div>
      </div>
    </div>

    <div class="panel-measure" id="panelMeasure" aria-hidden="true">
      <h3>测量</h3>
      <div class="stat-row">
        <span class="stat-label">选中长度</span>
        <div class="stat-units pulse-target" id="selLenBlock" aria-live="polite">
          <span class="stat-placeholder">—</span>
        </div>
      </div>
      <div class="stat-row">
        <span class="stat-label">全部总长</span>
        <div class="stat-units pulse-target" id="totalLenBlock" aria-live="polite">
          <span class="stat-placeholder">0</span>
        </div>
      </div>
      <p class="calib-note" id="calibNote">
        分「图上换算」与「屏上约」两组单位；放大缩小只改变后者。老师可在常用缩放下「标定」。
      </p>
    </div>

    <footer class="bottom-hint">
      「拉直演示」把封闭轮廓形变成下方等长直线后，可用「还原曲线」恢复；需先还原或删掉直线后才能再次拉直。「弦线对比」保留原曲线并复制弦线与等弧长线；直线模式：单击加点连线，双击或 Esc 结束。
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
